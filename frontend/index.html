<!DOCTYPE html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>jev-use</title>
    <link rel="icon" href="/icons/icon.svg" type="image/svg+xml" />
    <link rel="alternate icon" href="/icons/icon-192.png" type="image/png" sizes="192x192" />
    <link rel="apple-touch-icon" href="/icons/icon-180.png" />
    <meta name="theme-color" content="#fff8f0" />
    <link rel="stylesheet" href="/styles/base.css" />
  </head>
  <body>
    <header class="top">
      <a class="brand" href="/">jev-use</a>
      <div class="header-right">
        <label class="toggle" title="ブラウザを表示せずに動かす">
          <input type="checkbox" id="headless-toggle" />
          <span>ヘッドレス</span>
        </label>
        <p id="system-status" data-state="loading">接続確認中</p>
      </div>
    </header>

    <main>
      <p id="greeting" class="greeting"></p>
      <p id="greeting-sub" class="greeting-sub"></p>
      <h1>ブラウザに調べものを任せる</h1>
      <p class="lede">
        開いたページのボタンと入力欄を読み、次に押す場所を選んで実行します。Enter で送信（Shift+Enter で改行）。
      </p>

      <form id="task-form">
        <div class="input-wrap">
          <textarea
            id="task-input"
            rows="2"
            placeholder="ブラウザで実行したいことを入力"
            autofocus
          ></textarea>
          <button type="button" id="clear-btn" class="clear-btn" title="入力をクリア" aria-label="入力をクリア" hidden>×</button>
        </div>
        <details id="recent-history" class="recent-history" hidden>
          <summary>最近の履歴</summary>
          <ul id="history-list"></ul>
        </details>
        <p id="confirm" class="confirm" hidden></p>
        <div class="actions">
          <button type="submit" id="run-btn">実行する</button>
          <button type="button" id="stop-btn" class="quiet" hidden>停止</button>
        </div>
        <p id="form-note" class="note"></p>
      </form>

      <section id="run" hidden>
        <p id="page-line" class="page-line"></p>
        <article id="result" hidden>
          <p id="result-text"></p>
          <button type="button" id="copy-btn" class="quiet">コピー</button>
        </article>
        <p id="human-check" class="confirm" hidden></p>
        <p id="user-input" class="confirm" hidden></p>
        <button type="button" id="human-ready-btn" class="quiet" hidden>確認できた</button>
        <button type="button" id="preview-open" aria-label="画像を全画面表示" hidden>
          <img id="preview" alt="開いているページ" />
        </button>
        <ol id="steps"></ol>
        <div id="approval" class="approval" hidden>
          <p id="approval-text"></p>
          <div class="actions">
            <button type="button" id="approve-btn">実行する</button>
            <button type="button" id="deny-btn" class="quiet">やめる</button>
          </div>
        </div>
      </section>
    </main>

    <dialog id="preview-dialog" aria-label="画像の全画面表示">
      <button type="button" id="preview-close" aria-label="閉じる">×</button>
      <img id="preview-full" alt="開いているページ" />
    </dialog>

    <script type="module" src="/scripts/index.js"></script>
  </body>
</html>
