<!DOCTYPE html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>jev-use</title>
    <link rel="icon" href="/icons/icon.svg" type="image/svg+xml" />
    <link rel="alternate icon" href="/icons/icon-192.png" type="image/png" sizes="192x192" />
    <link rel="apple-touch-icon" href="/icons/icon-180.png" />
    <meta name="theme-color" content="#2f6fb8" />
    <!-- フォントが読めない環境でもシステムのゴシック体で崩れないよう、読み込みは任意扱い -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700;900&display=swap"
    />
    <link rel="stylesheet" href="/styles/scene.css" />
    <link rel="stylesheet" href="/styles/base.css" />
  </head>
  <body>
    <!-- 背景の空。時刻に合わせて scene.js が太陽・月・色を動かし、星・雲・街並みを生成する -->
    <div class="sky" aria-hidden="true">
      <canvas class="stars" id="stars"></canvas>
      <div class="sky-glow"></div>
      <div class="sky-body" id="sky-body">
        <span class="sun"></span>
        <canvas class="moon" id="moon" width="256" height="256"></canvas>
      </div>
      <div class="clouds" id="clouds"></div>
      <svg class="skyline" id="skyline" viewBox="0 0 1600 300" preserveAspectRatio="xMidYMax slice">
        <defs>
          <linearGradient id="haze-grad" x1="0" y1="0" x2="0" y2="1">
            <stop class="haze-stop" offset="0" stop-opacity="0" />
            <stop class="haze-stop" offset="1" stop-opacity="0.75" />
          </linearGradient>
        </defs>
      </svg>
      <svg class="filters" width="0" height="0"><defs id="cloud-filters"></defs></svg>
    </div>

    <header class="top">
      <a class="brand" href="/"><img src="/icons/icon.svg" alt="" width="28" height="28" />jev-use</a>
      <p id="system-status" class="status" data-state="loading">接続確認中</p>
    </header>

    <main>
      <section class="hello">
        <p id="greeting" class="greeting"></p>
        <h1>ブラウザに調べものを任せる</h1>
        <p id="greeting-sub" class="greeting-sub"></p>
      </section>

      <div class="stage">
        <div class="browser" id="browser" data-mode="idle">
          <!-- マスコット。状態は data-mood で切り替える -->
          <div class="jev" id="jev" data-mood="idle" aria-hidden="true">
            <p class="jev-bubble" id="jev-bubble">何を調べましょう？</p>
            <svg class="jev-body" viewBox="0 0 120 120">
              <defs>
                <linearGradient id="jev-shell" x1="0" y1="0" x2="0" y2="1">
                  <stop offset="0" stop-color="#f6f7fa" />
                  <stop offset=".42" stop-color="#d7dce4" />
                  <stop offset=".8" stop-color="#9ba4b3" />
                  <stop offset="1" stop-color="#6c7586" />
                </linearGradient>
                <!-- 左右の縁を暗くして丸みと金属の厚みを出す -->
                <linearGradient id="jev-rim" x1="0" y1="0" x2="1" y2="0">
                  <stop offset="0" stop-color="#1b2030" stop-opacity=".32" />
                  <stop offset=".2" stop-color="#1b2030" stop-opacity="0" />
                  <stop offset=".8" stop-color="#1b2030" stop-opacity="0" />
                  <stop offset="1" stop-color="#1b2030" stop-opacity=".4" />
                </linearGradient>
                <linearGradient id="jev-face" x1="0" y1="0" x2="0" y2="1">
                  <stop offset="0" stop-color="#1c2334" />
                  <stop offset="1" stop-color="#06080e" />
                </linearGradient>
                <linearGradient id="jev-metal" x1="0" y1="0" x2="1" y2="0">
                  <stop offset="0" stop-color="#5d6676" />
                  <stop offset=".5" stop-color="#c9ced8" />
                  <stop offset="1" stop-color="#5d6676" />
                </linearGradient>
                <radialGradient id="jev-ground" cx=".5" cy=".5" r=".5">
                  <stop offset="0" stop-color="#0a1020" stop-opacity=".35" />
                  <stop offset="1" stop-color="#0a1020" stop-opacity="0" />
                </radialGradient>
              </defs>
              <ellipse cx="60" cy="113" rx="36" ry="5" fill="url(#jev-ground)" />
              <g class="jev-antenna">
                <rect x="58.5" y="10" width="3" height="16" rx="1.5" fill="url(#jev-metal)" />
                <circle class="jev-lamp" cx="60" cy="9" r="4" />
                <circle cx="58.6" cy="7.6" r="1.2" fill="rgba(255,255,255,.7)" />
              </g>
              <rect x="9" y="50" width="9" height="26" rx="3.5" fill="url(#jev-metal)" />
              <rect x="102" y="50" width="9" height="26" rx="3.5" fill="url(#jev-metal)" />
              <rect x="16" y="24" width="88" height="80" rx="30" fill="url(#jev-shell)" />
              <rect x="16" y="24" width="88" height="80" rx="30" fill="url(#jev-rim)" />
              <ellipse cx="50" cy="31" rx="24" ry="4.5" fill="rgba(255,255,255,.75)" />
              <rect x="23.5" y="36.5" width="73" height="51" rx="21.5" fill="#4b5363" />
              <rect x="26" y="39" width="68" height="46" rx="19" fill="url(#jev-face)" />
              <g class="jev-eyes" id="jev-eyes">
                <ellipse class="jev-eye" cx="47" cy="60" rx="5.5" ry="7" />
                <ellipse class="jev-eye" cx="73" cy="60" rx="5.5" ry="7" />
              </g>
              <path class="jev-mouth" d="M53 74 Q60 79 67 74" />
              <!-- 前面ガラスの映り込み -->
              <path d="M30 56 Q31 42 46 41 L66 41 Q44 45 30 56 Z" fill="rgba(255,255,255,.14)" />
            </svg>
          </div>

          <div class="chrome">
            <div class="tabs">
              <span class="tab" id="tab">
                <span class="tab-icon"></span>
                <span class="tab-title" id="tab-title">新しいタブ</span>
                <span class="tab-x" aria-hidden="true"></span>
              </span>
              <span class="tab-new" aria-hidden="true"></span>
              <label class="toggle" title="ブラウザのウィンドウを出さずに動かす">
                <input type="checkbox" id="headless-toggle" />
                <span class="switch"></span>
                <span>ヘッドレス</span>
              </label>
              <span class="winctl" aria-hidden="true"><i class="min"></i><i class="max"></i><i class="close"></i></span>
            </div>

            <div class="toolbar">
              <!-- 戻る・進む・再読み込みは見た目だけの飾り -->
              <span class="nav" aria-hidden="true">
                <svg viewBox="0 0 24 24"><path d="M20 11H7.8l5.6-5.6L12 4l-8 8 8 8 1.4-1.4L7.8 13H20z" /></svg>
                <svg viewBox="0 0 24 24"><path d="M4 11h12.2l-5.6-5.6L12 4l8 8-8 8-1.4-1.4 5.6-5.6H4z" /></svg>
                <svg viewBox="0 0 24 24"><path d="M17.65 6.35A7.95 7.95 0 0 0 12 4a8 8 0 1 0 7.73 10h-2.08A6 6 0 1 1 12 6c1.66 0 3.14.69 4.22 1.78L13 11h7V4z" /></svg>
              </span>
              <form id="task-form" class="omnibox">
                <svg class="omni-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M15.5 14h-.79l-.28-.27A6.5 6.5 0 1 0 14 15.5l.27.28v.79l5 4.99L20.49 19zm-6 0a4.5 4.5 0 1 1 0-9 4.5 4.5 0 0 1 0 9z" /></svg>
                <textarea
                  id="task-input"
                  rows="1"
                  placeholder="やりたいことを入力（例：明日の東京の天気を調べて）"
                  aria-label="やりたいこと"
                  autofocus
                ></textarea>
                <button type="button" id="clear-btn" class="clear-btn" title="入力をクリア" aria-label="入力をクリア" hidden>×</button>
                <button type="button" id="stop-btn" class="stop-btn" hidden>停止</button>
                <button type="submit" id="run-btn" class="run-btn">実行する</button>
              </form>
            </div>
            <div class="progress" aria-hidden="true"><span></span></div>
          </div>

          <p id="confirm" class="banner warn" hidden></p>
          <p id="form-note" class="banner error" hidden></p>

          <div class="viewport">
            <!-- 待機中：新しいタブ風のホーム -->
            <div class="home" id="home">
              <p class="home-title">最近の依頼</p>
              <ul id="history-list" class="history"></ul>
              <p class="home-empty" id="home-empty">ここに最近の依頼が並びます。上の欄に入力して Enter で始めます。</p>
            </div>

            <!-- 実行中：ページのライブ映像 -->
            <section id="run" class="run" hidden>
              <button type="button" id="preview-open" class="shot" aria-label="画像を全画面表示" hidden>
                <img id="preview" alt="開いているページ" />
              </button>
              <div class="loading" id="loading">
                <span class="spinner"></span>
                <p>ページを開いています</p>
              </div>
              <span class="scan" aria-hidden="true"></span>

              <div id="approval" class="overlay" hidden>
                <div class="sheet">
                  <p class="sheet-title">この操作を実行してよいですか？</p>
                  <p id="approval-text"></p>
                  <div class="actions">
                    <button type="button" id="approve-btn" class="primary">実行する</button>
                    <button type="button" id="deny-btn" class="quiet">やめる</button>
                  </div>
                </div>
              </div>

              <div id="pause" class="overlay" hidden>
                <div class="sheet">
                  <p id="human-check" hidden></p>
                  <p id="user-input" hidden></p>
                  <div class="actions">
                    <button type="button" id="human-ready-btn" class="primary">確認できた</button>
                  </div>
                </div>
              </div>

              <article id="result" class="result" hidden>
                <p class="result-title">わかったこと</p>
                <p id="result-text"></p>
                <div class="actions">
                  <button type="button" id="copy-btn" class="quiet">コピー</button>
                  <button type="button" id="new-btn" class="quiet">新しい依頼</button>
                </div>
              </article>
            </section>
          </div>

          <p id="page-line" class="statusbar">待機中</p>
        </div>

        <aside class="log" id="log" hidden>
          <p class="log-title">操作の記録</p>
          <ol id="steps"></ol>
        </aside>
      </div>
    </main>

    <dialog id="preview-dialog" aria-label="画像の全画面表示">
      <button type="button" id="preview-close" aria-label="閉じる">×</button>
      <img id="preview-full" alt="開いているページ" />
    </dialog>

    <script type="module" src="/scripts/index.js"></script>
  </body>
</html>
