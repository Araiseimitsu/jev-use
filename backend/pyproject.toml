[project]
name = "jev-use-backend"
version = "0.1.0"
description = "DOM を読んで Jev が次の操作を選び、Playwright が実行するブラウザエージェント"
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.115",
    "httpx>=0.28",
    "playwright>=1.63.0",
    "pydantic-settings>=2.0",
    "sse-starlette>=3.4.11",
    "typesafe-sdk>=0.7.0",
    "uvicorn>=0.30",
    "winotify>=1.1.0",
]

[dependency-groups]
dev = [
    "httpx>=0.27",
    "pytest>=8.0",
]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
